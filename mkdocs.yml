site_name: YNAB MCP
site_description: MCP server for You Need A Budget
site_url: https://senivel.github.io/ynab-mcp/
repo_url: https://github.com/senivel/ynab-mcp
repo_name: senivel/ynab-mcp
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: list
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            line_length: 88
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - What is MCP?: getting-started/what-is-mcp.md
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
      - Troubleshooting: getting-started/troubleshooting.md
  - User Guide:
      - Tools:
          - user-guide/tools/index.md
          - Budget Tools: user-guide/tools/budget-tools.md
          - Account Tools: user-guide/tools/account-tools.md
          - Category Tools: user-guide/tools/category-tools.md
          - Transaction Tools: user-guide/tools/transaction-tools.md
          - Payee Tools: user-guide/tools/payee-tools.md
          - Month Tools: user-guide/tools/month-tools.md
          - Scheduled Transaction Tools: user-guide/tools/scheduled-transaction-tools.md
          - Cache Tools: user-guide/tools/cache-tools.md
      - Prompts:
          - Analysis Prompts: user-guide/prompts/analysis-prompts.md
          - Workflow Guides: user-guide/prompts/workflow-guides.md
          - Core Prompts: user-guide/prompts/core-prompts.md
      - Resources: user-guide/resources.md
  - API Reference:
      - Tools API: api-reference/tools-api.md
      - Prompts API: api-reference/prompts-api.md
      - Resources API: api-reference/resources-api.md
      - Internals:
          - Client: api-reference/internals/client.md
          - Models: api-reference/internals/models.md
          - Errors: api-reference/internals/errors.md
  - Contributing:
      - contributing/index.md
      - Architecture: contributing/architecture.md
      - Changelog: contributing/changelog.md
      - License: contributing/license.md
