[project]
name = "you-need-an-advisor-mcp"
version = "1.0.0"
description = "MCP server for YNAB -- your AI-powered budget advisor"
readme = "README.md"
authors = [{ name = "Alex Levine", email = "awlevine@pm.me" }]
requires-python = ">=3.13"
keywords = [
  "ynab",
  "mcp",
  "budget",
  "model-context-protocol",
  "advisor",
  "ynaa",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = ["fastmcp>=3.1.0", "httpx>=0.28.1"]

[project.urls]
Documentation = "https://senivel.github.io/you-need-an-advisor-mcp/"
Repository = "https://github.com/senivel/you-need-an-advisor-mcp"
Issues = "https://github.com/senivel/you-need-an-advisor-mcp/issues"
Changelog = "https://senivel.github.io/you-need-an-advisor-mcp/changelog/"

[project.scripts]
ynaa-mcp = "ynaa_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ynaa_mcp"

[tool.ruff]
line-length = 88
indent-width = 4
show-fixes = true
unsafe-fixes = true
preview = true

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = ["W292"]
select = ["ALL"]
ignore = [
  ## disabled linters
  "S",   # flake8-bandit
  "CPY", # flake8-copyright
  "DJ",  # flake8-django
  "TD",  # flake8-todo
  "FIX", # flake8-fixme
  "AIR", # airflow

  ## disabled rules
  "COM812", # trailing comma
  "DTZ005", # call datetime.now() without tz
  "ISC001", # implicit single line str concat
  "TRY003", # long messages outside exception class
  "D203",   # 1 blank line required before class docstring
  "D213",   # Multi-line docstring summary should start at the second line

  ## type-checking -- pyright strict owns these domains
  "ANN",  # annotations: pyright enforces with full type inference
  "TCH",  # TYPE_CHECKING imports: pyright handles better
  "PYI",  # stub files: pyright's domain
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["D104", "F401"]
"tests/**.py" = ["D102", "PLR2004", "PLR6301", "RUF069"]
"src/ynaa_mcp/server.py" = ["F401", "E402"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
skip-magic-trailing-comma = false

[tool.pyright]
include = ["src/ynaa_mcp"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.coverage.run]
branch = true
omit = ["**/__init__.py", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "pass", "raise NotImplementedError"]

[tool.pytest.ini_options]
addopts = "-rsxXE --tb=short --strict-markers --cov --cov-append --disable-socket --allow-unix-socket"
xfail_strict = true

[dependency-groups]
dev = [
  "freezegun>=1.5.5",
  "hypothesis>=6.151.9",
  "pre-commit>=4.5.1",
  "pyright>=1.1.408",
  "pytest>=9.0.2",
  "pytest-clarity>=1.0.1",
  "pytest-cov>=7.0.0",
  "pytest-icdiff>=0.9",
  "pytest-mock>=3.15.1",
  "pytest-socket>=0.7.0",
  "pytest-sugar>=1.1.1",
  "ruff>=0.15.4",
]
docs = [
    "mike>=2.1.3",
    "mkdocs-material>=9.7,<10",
    "mkdocstrings[python]>=0.26",
]
