repos:
  - repo: local
    hooks:
      - id: no-planning-files
        name: block .planning/ from commits
        entry: "sh -c 'echo Blocked - .planning/ files should not be committed && exit 1'"
        language: system
        files: ^\.planning/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: \.(json|ya?ml|md)$
        args: [--cache, --cache-location, ./.prettier_cache]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        name: ruff lint fixes
        args: [--fix-only, --unsafe-fixes, --show-fixes]
      - id: ruff-format
        name: ruff format
